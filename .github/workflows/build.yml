name: Build chroma-unlock dylib

on:
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  dylib:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: brew install make dpkg ldid

      - name: Build
        run: env -u MAKELEVEL gmake clean package

      - name: Collect the dylib and the .deb
        run: |
          mkdir -p out
          dy="$(find .theos/obj -name 'chromaunlock.dylib' | head -1)"
          [ -n "$dy" ] || dy="$(find . -name 'chromaunlock.dylib' | head -1)"
          [ -n "$dy" ] || { echo "::error::chromaunlock.dylib not found"; exit 1; }
          cp "$dy" out/chromaunlock.dylib
          deb="$(find packages -name '*.deb' | head -1)"
          [ -n "$deb" ] && cp "$deb" out/chroma-unlock.deb || echo "::warning::no .deb produced"
          ls -la out

      - uses: actions/upload-artifact@v5
        with:
          name: chroma-unlock
          path: out/*
          if-no-files-found: error
